name: Hugin Desktop Main Pipeline

env:
    GITHUB_REGISTRY: 'ghcr.io'
    GITHUB_OWNER: 'kryptokrona'
    GH_TOKEN: ${{ secrets.HUGIN_DESKTOP_SECRET }}
    # Visual Studio version node-gyp uses on Windows.
    GYP_MSVS_VERSION: '2022'
    # C++ standard for the native modules built against the Electron headers.
    CXXFLAGS: '-std=gnu++17'

on:
    push:
        branches:
            - main
            - xkr-v2
        paths-ignore:
            - '*.md'
            - '.run/**'
            - '.github/ISSUE_TEMPLATE/**'

concurrency:
    # One main build per branch at a time.
    group: main-ci-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    build:
        name: 'Build: ${{ matrix.config.name }} / ${{ matrix.config.platform }}'
        runs-on: ${{ matrix.config.os }}

        strategy:
            fail-fast: true
            matrix:
                config:
                    - { name: 'Windows Latest', os: windows-latest, platform: x64 }
                    - { name: 'Ubuntu Latest', os: ubuntu-latest, platform: x64 }
                    - { name: 'macOS x64', os: macos-15-intel, platform: x64 }
                    - { name: 'macOS arm64', os: macos-latest, platform: arm64 }

        env:
            PLATFORM: ${{ matrix.config.platform }}

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.11'

            - name: Install libudev + X11 headers
              if: matrix.config.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential \
                      libx11-dev \
                      libxt-dev \
                      libxtst-dev \
                      libxkbfile-dev \
                      libxrandr-dev \
                      libxi-dev \
                      libxinerama-dev \
                      libxcursor-dev \
                      libudev-dev

            - name: Install pnpm
              # Installs the version in the `packageManager` field of package.json.
              uses: pnpm/action-setup@v5

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: 20
                  cache: pnpm

            - name: Set up MSBuild (Windows)
              # Puts MSBuild.exe on PATH for node-gyp.
              if: matrix.config.os == 'windows-latest'
              uses: microsoft/setup-msbuild@v3

            - name: Install dependencies
              # Installs exactly what pnpm-lock.yaml lists; .npmrc sets the flat (hoisted) layout.
              run: pnpm install --frozen-lockfile

            - name: Build ${{ matrix.config.name }}
              if: matrix.config.os == 'windows-latest'
              run: pnpm run build:win-${{ matrix.config.platform }}

            - name: Build ${{ matrix.config.name }}
              if: matrix.config.os == 'ubuntu-latest'
              run: pnpm run build:linux-${{ matrix.config.platform }}

            - name: Build ${{ matrix.config.name }}
              if: startsWith(matrix.config.os, 'macos')
              run: pnpm run build:mac-${{ matrix.config.platform }}

            - name: 'Upload ${{ matrix.config.name }} Artifact'
              uses: actions/upload-artifact@v6
              if: matrix.config.os == 'windows-latest'
              with:
                  name: windows-latest
                  path: |
                      dist/*.exe

            - name: 'Upload ${{ matrix.config.name }} Deb Artifact'
              uses: actions/upload-artifact@v6
              if: matrix.config.os == 'ubuntu-latest'
              with:
                  name: ubuntu-latest-deb
                  path: |
                      dist/*.deb

            - name: 'Upload ${{ matrix.config.name }} Snap Artifact'
              uses: actions/upload-artifact@v6
              if: matrix.config.os == 'ubuntu-latest'
              with:
                  name: ubuntu-latest-snap
                  path: |
                      dist/*.snap

            - name: 'Upload ${{ matrix.config.name }} Artifact'
              uses: actions/upload-artifact@v6
              if: matrix.config.name == 'macOS x64'
              with:
                  name: macos-x64
                  path: |
                      dist/*.dmg

            - name: 'Upload ${{ matrix.config.name }} Artifact'
              uses: actions/upload-artifact@v6
              if: matrix.config.name == 'macOS arm64'
              with:
                  name: macos-arm64
                  path: |
                      dist/*.dmg
